name: Comment on a closed issue

# Triggers intentionally disabled for Argus-OSS-Security.
# on:
#   issue_comment:
#     types: [created]
# 
jobs:
  reconsider_closed_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: gradle/issue-management-action/issue-comment-triage@v2
